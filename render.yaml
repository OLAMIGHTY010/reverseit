# Render Blueprint Specification (Infrastructure as Code)
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: smartreversal-db
    databaseName: smartreversal_db
    user: smartreversal_app
    plan: starter

services:
  # ----------------------------------------------------------------------------
  # Redis / Key-Value Cache & Broker
  # ----------------------------------------------------------------------------
  - type: keyvalue
    name: smartreversal-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # internal access only

  # ----------------------------------------------------------------------------
  # Core Go API Server (Runs migrations via preDeployCommand before start)
  # ----------------------------------------------------------------------------
  - type: web
    name: smartreversal-api
    runtime: docker
    dockerfilePath: ./infra/docker/Dockerfile.api
    preDeployCommand: /app/migrate up
    dockerCommand: /app/api
    healthCheckPath: /v1/ready
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: info
      - key: API_PORT
        value: "8080"
      - key: DB_HOST
        fromDatabase:
          name: smartreversal-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: smartreversal-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: smartreversal-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: smartreversal-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: smartreversal-db
          property: database
      - key: DB_SSLMODE
        value: require
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: smartreversal-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: smartreversal-redis
          property: port
      - key: FINANCIAL_EXECUTION_ENABLED
        value: "false"
      - key: JWT_KEY_ID
        value: k1
      - key: JWT_TOKEN_TTL
        value: 15m
      - key: JWT_PRIVATE_KEY
        generateValue: true
      - key: JWT_PUBLIC_KEYS
        generateValue: true
      - key: ACCOUNT_TOKEN_KEY
        generateValue: true
      - key: ACCOUNT_ENC_KEY
        generateValue: true
      - key: ACCOUNT_ENC_KEY_ID
        value: k1

  # ----------------------------------------------------------------------------
  # Background Asynchronous Worker
  # ----------------------------------------------------------------------------
  - type: worker
    name: smartreversal-worker
    runtime: docker
    dockerfilePath: ./infra/docker/Dockerfile.api
    dockerCommand: /app/worker
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: info
      - key: WORKER_HEALTH_PORT
        value: "8081"
      - key: DB_HOST
        fromDatabase:
          name: smartreversal-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: smartreversal-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: smartreversal-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: smartreversal-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: smartreversal-db
          property: database
      - key: DB_SSLMODE
        value: require
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: smartreversal-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: smartreversal-redis
          property: port
      - key: FINANCIAL_EXECUTION_ENABLED
        value: "false"

  # ----------------------------------------------------------------------------
  # FastAPI AI Intelligence Microservice
  # ----------------------------------------------------------------------------
  - type: web
    name: smartreversal-ai
    runtime: python
    rootDir: apps/ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: smartreversal-db
          property: connectionString

  # ----------------------------------------------------------------------------
  # React / Vite Web Operations Console (Static Site on Render)
  # ----------------------------------------------------------------------------
  - type: web
    name: smartreversal-web
    runtime: static
    buildCommand: npm install && npm run build:web
    staticPublishPath: apps/web/dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
